<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shubhranshul Dwivedi | Portfolio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-serif { font-family: 'Cormorant Garamond', serif; }
        html { scroll-behavior: smooth; }
        /* Prevent layout shift before React hydration */
        #root { min-height: 100vh; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Fixed: Correctly destructure icons from the global 'lucide' object
        // Lucide puts icons in 'lucide.icons' or as capitalized properties in the global 'lucide'
        const Linkedin = () => <i data-lucide="linkedin"></i>;
        const ExternalLink = () => <i data-lucide="external-link"></i>;
        const ArrowUpRight = () => <i data-lucide="arrow-up-right"></i>;
        const ShieldCheck = () => <i data-lucide="shield-check"></i>;
        const Zap = () => <i data-lucide="zap"></i>;

        const App = () => {
            // Re-run lucide creation when component mounts
            React.useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, []);

            const profile = {
                name: "Shubhranshul Dwivedi",
                title: "Counseling Psychologist & Clinical Operations Lead",
                stats: [
                    { value: "500+", label: "Clinical Hours" },
                    { value: "03", label: "Research Works" },
                    { value: "03+", label: "Years Expertise" },
                    { value: "Action", label: "Driven Outcomes" }
                ]
            };

            const specializations = [
                { 
                    title: "Relational Intelligence",
                    desc: "Deciphering communication patterns and rebuilding intimacy through structured behavioral intervention.",
                    color: "bg-[#dcf2ed]"
                },
                { 
                    title: "Circadian Wellness",
                    desc: "Sleep hygiene protocols designed as the fundamental pillar for cognitive and emotional resilience.",
                    color: "bg-[#e1f0d7]"
                },
                { 
                    title: "Indigenous Therapeutics",
                    desc: "Blending traditional Indian psychology with modern CBT for anxiety management.",
                    color: "bg-white border border-[#D1E7E0]"
                },
                { 
                    title: "Corporate Wellness",
                    desc: "Bespoke strategies for organizational health and executive resilience.",
                    color: "bg-[#2D6A4F] text-white"
                }
            ];

            const clinicalExperience = [
                {
                    role: "Associate Program Manager (Clinical Operations)",
                    org: "YourDost",
                    date: "2025 – Present",
                    desc: "Driving organizational growth through behavioral development and clinical strategy, while providing expert counseling to an international clientele."
                },
                {
                    role: "Counseling Psychologist & Consultant",
                    org: "YourDost (Skill India Project)",
                    date: "2023 – 2025",
                    desc: "Direct psychiatric management and psychological readiness assessments for candidates, focusing on resilience and career-related anxiety."
                },
                {
                    role: "Behavioral Health Coach",
                    org: "Fitelo",
                    date: "2022 – 2023",
                    desc: "Facilitated behavioral habit modification for clients, bridging physical health with psychological well-being."
                }
            ];

            const publications = [
                {
                    title: "Addressing Anxiety Disorder through Indigenous Therapeutics: A Review",
                    details: "Dev Sanskriti Interdisciplinary International Journal, 20",
                    link: "https://doi.org/10.36018/dsiij.v20i.265",
                },
                {
                    title: "Emotional Need Fulfillment and Hostility of Adolescents",
                    details: "Master's Dissertation | Focus on Behavioral Patterns",
                },
                {
                    title: "Depression levels of video game players vs non-players",
                    details: "Bachelor's Project | Comparative Psychological Study",
                }
            ];

            return (
                <div className="bg-[#F0F9F7] text-[#1c1917] min-h-screen">
                    {/* Navigation */}
                    <nav className="fixed w-full z-50 bg-[#F0F9F7]/85 backdrop-blur-xl border-b border-[#D1E7E0]/50">
                        <div className="max-w-7xl mx-auto px-6 md:px-12 py-6 flex justify-between items-center">
                            <div className="flex flex-col">
                                <span className="text-xl font-medium tracking-tighter uppercase">{profile.name}</span>
                                <span className="text-[9px] font-bold tracking-[0.2em] text-[#2D6A4F] uppercase mt-1 leading-none">
                                    Counseling Psychologist • Corporate Wellness
                                </span>
                            </div>
                            <div className="hidden lg:flex space-x-12 text-[10px] uppercase font-semibold tracking-[0.2em] text-stone-500">
                                <a href="#about" className="hover:text-[#2D6A4F] transition">Philosophy</a>
                                <a href="#specializations" className="hover:text-[#2D6A4F] transition">Specializations</a>
                                <a href="#experience" className="hover:text-[#2D6A4F] transition">Experience</a>
                                <a href="#contact" className="hover:text-[#2D6A4F] transition">Inquiry</a>
                            </div>
                            <div className="flex items-center gap-4">
                                <a href="https://www.linkedin.com/in/shubhranshul-dwivedi/" target="_blank" className="w-10 h-10 flex items-center justify-center rounded-full border border-[#D1E7E0] text-[#2D6A4F] hover:bg-[#D1E7E0] transition">
                                    <Linkedin />
                                </a>
                                <a href="#contact" className="hidden sm:block text-[10px] font-bold uppercase tracking-[0.2em] bg-[#e3f6cc] text-[#1B4332] px-8 py-3 rounded-full hover:brightness-95 transition shadow-sm border border-[#D1E7E0]">
                                    Book Session
                                </a>
                            </div>
                        </div>
                    </nav>

                    {/* Hero Section */}
                    <header id="about" className="min-h-screen flex flex-col justify-center px-6 md:px-12 pt-20">
                        <div className="max-w-7xl mx-auto w-full">
                            <div className="grid lg:grid-cols-12 gap-12 items-end">
                                <div className="lg:col-span-9">
                                    <div className="flex items-center gap-4 mb-10">
                                        <span className="text-[10px] font-bold text-[#2D6A4F] uppercase tracking-[0.2em]">Growth • Resilience • Balance</span>
                                        <div className="h-px flex-1 bg-[#D1E7E0]"></div>
                                    </div>
                                    <h1 className="text-6xl md:text-[8.5rem] font-medium leading-[0.85] tracking-tighter mb-12 font-serif">
                                        Psychological <br /> <span className="italic font-light text-[#2D6A4F]">Architecture.</span>
                                    </h1>
                                    <p className="text-xl md:text-3xl text-stone-600 font-light leading-relaxed max-w-3xl">
                                        A scientific approach to behavioral transformation. Designing bespoke strategies for <span className="text-[#1B4332] font-normal">sustainable</span> relationship dynamics and healthy clinical ecosystems.
                                    </p>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Stats Bar */}
                    <section className="py-20 border-y border-[#D1E7E0] bg-[#dcf2ed]">
                        <div className="max-w-7xl mx-auto px-6 md:px-12">
                            <div className="grid grid-cols-2 lg:grid-cols-4 gap-12">
                                {profile.stats.map((stat, i) => (
                                    <div key={i} className="space-y-1">
                                        <p className="text-4xl font-serif italic text-[#1B4332]">{stat.value}</p>
                                        <p className="text-[9px] font-bold text-[#2D6A4F] uppercase tracking-[0.2em]">{stat.label}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* Methodology */}
                    <section className="py-32 px-6 md:px-12 bg-white">
                        <div className="max-w-7xl mx-auto">
                            <div className="grid lg:grid-cols-2 gap-24 items-center">
                                <div>
                                    <h2 className="text-xs font-bold text-[#2D6A4F] uppercase tracking-[0.4em] mb-8">Professional Philosophy</h2>
                                    <h3 className="text-5xl font-medium leading-tight mb-8 font-serif">Empowerment Through Evidence.</h3>
                                    <p className="text-stone-600 leading-relaxed mb-6">
                                        My practice is built on the intersection of deep scientific understanding and clinical operations. I translate complex human psychology into actionable, outcome-driven sessions and clinical workflows.
                                    </p>
                                    <p className="text-stone-600 leading-relaxed italic">
                                        I leverage indigenous therapeutics and modern psychometric analysis to provide deeper insight into behavioral transformation.
                                    </p>
                                </div>
                                <div className="grid gap-4">
                                    <div className="p-10 bg-[#e1f0d7] rounded-3xl">
                                        <div className="text-[#1B4332] mb-4 scale-150 transform origin-left"><ShieldCheck /></div>
                                        <h4 className="text-2xl font-semibold mb-3 text-[#1B4332] font-serif">Clinical Excellence</h4>
                                        <p className="text-sm text-[#1B4332]/80 leading-relaxed">Maintaining the highest standards of patient safety and therapeutic efficacy through structured operations.</p>
                                    </div>
                                    <div className="p-10 bg-stone-50 border border-[#D1E7E0] rounded-3xl">
                                        <div className="text-[#2D6A4F] mb-4 scale-150 transform origin-left"><Zap /></div>
                                        <h4 className="text-2xl font-semibold mb-3 text-[#1B4332] font-serif">Outcome Driven</h4>
                                        <p className="text-sm text-stone-500 leading-relaxed">Focusing on measurable psychological growth through verified behavioral intervention strategies.</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Experience Track */}
                    <section id="experience" className="py-32 bg-[#1c1917] text-stone-400 px-6 md:px-12">
                        <div className="max-w-7xl mx-auto">
                            <div className="flex justify-between items-baseline mb-20">
                                <h2 className="text-4xl font-medium text-white tracking-tight font-serif">Professional Track</h2>
                                <span className="text-[10px] font-bold tracking-[0.2em] uppercase text-[#2D6A4F]">Verified Excellence</span>
                            </div>
                            
                            <div className="space-y-2">
                                {clinicalExperience.map((exp, i) => (
                                    <div key={i} className="group py-12 border-t border-stone-800 grid md:grid-cols-12 gap-8 items-start hover:bg-stone-800/30 px-6 transition-all rounded-xl">
                                        <div className="md:col-span-3 text-[#2D6A4F] font-medium text-xl italic font-serif">{exp.date}</div>
                                        <div className="md:col-span-6">
                                            <h3 className="text-white text-2xl font-bold mb-2 tracking-tight">{exp.role}</h3>
                                            <p className="text-[#2D6A4F] uppercase text-[10px] font-bold tracking-[0.2em] mb-6">{exp.org}</p>
                                            <p className="text-sm leading-relaxed">{exp.desc}</p>
                                        </div>
                                        <div className="md:col-span-3 md:text-right">
                                            <p className="text-[10px] font-bold text-stone-600 uppercase tracking-[0.2em]">Clinical & Coaching</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* Services Section */}
                    <section id="specializations" className="py-32 px-6 md:px-12 bg-white">
                        <div className="max-w-7xl mx-auto">
                            <div className="text-center mb-24">
                                <h2 className="text-5xl font-medium mb-6 font-serif">Wellness Ecosystems</h2>
                                <p className="text-stone-500 max-w-2xl mx-auto italic font-serif text-xl">"Nurturing potential through intentional behavioral design."</p>
                            </div>
                            
                            <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
                                {specializations.map((spec, i) => (
                                    <div key={i} className={`p-10 rounded-[2rem] hover:shadow-xl transition-all duration-500 flex flex-col justify-between min-h-[300px] ${spec.color}`}>
                                        <div>
                                            <h4 className="text-2xl font-bold mb-4 font-serif leading-tight">{spec.title}</h4>
                                            <p className="text-xs opacity-80 leading-relaxed">{spec.desc}</p>
                                        </div>
                                        <div className="self-end opacity-40"><ArrowUpRight /></div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* Research Section */}
                    <section id="research" className="py-32 px-6 md:px-12 bg-[#F0F9F7]">
                        <div className="max-w-7xl mx-auto">
                            <h2 className="text-[10px] font-bold uppercase tracking-[0.4em] text-stone-400 mb-16">Academic Contributions</h2>
                            <div className="max-w-4xl mx-auto space-y-12">
                                {publications.map((pub, i) => (
                                    <div key={i} className="group border-b border-[#D1E7E0] pb-10 last:border-0">
                                        <h4 className="text-2xl font-bold mb-4 font-serif group-hover:text-[#2D6A4F] transition-colors">
                                            {pub.title}
                                        </h4>
                                        <p className="text-stone-500 text-sm italic mb-6">"{pub.details}"</p>
                                        {pub.link && (
                                            <a href={pub.link} target="_blank" className="inline-flex items-center gap-2 text-[10px] font-bold uppercase tracking-widest text-[#2D6A4F] group/link">
                                                View Publication <span className="group-hover/link:translate-x-1 transition-transform"><ExternalLink /></span>
                                            </a>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>
                    {/* Initiatives & Assets Section */}
                    <section id="initiatives" className="py-32 px-6 md:px-12 bg-white">
                        <div className="max-w-7xl mx-auto">
                            <div className="flex flex-col md:flex-row justify-between items-end mb-16 gap-6">
                                <div>
                                    <h2 className="text-[10px] font-bold uppercase tracking-[0.4em] text-[#2D6A4F] mb-4">Strategic Ventures</h2>
                                    <h3 className="text-5xl font-medium font-serif">Scaling Cognitive Infrastructure.</h3>
                                </div>
                                <p className="text-stone-500 max-w-sm text-sm leading-relaxed">
                                    Current builds focused on democratizing high-level psychological prep and mental health tech.
                                </p>
                            </div>

                            <div className="grid md:grid-cols-2 gap-8">
                                {/* PsychEngine - Current Startup */}
                                <div className="group p-12 bg-stone-50 border border-[#D1E7E0] rounded-[3rem] hover:border-[#2D6A4F] transition-all duration-500">
                                    <div className="flex justify-between items-start mb-8">
                                        <div className="bg-[#2D6A4F] text-white p-3 rounded-2xl">
                                            <Zap />
                                        </div>
                                        <span className="text-[10px] font-bold text-[#2D6A4F] bg-[#e1f0d7] px-4 py-1 rounded-full uppercase tracking-widest">In Development</span>
                                    </div>
                                    <h4 className="text-3xl font-bold mb-4 font-serif">PsychEngine</h4>
                                    <p className="text-stone-600 mb-8 leading-relaxed">
                                        A data-driven learning engine designed for UGC NET Psychology aspirants. Moving beyond rote memorization into electrical brain architecture and cognitive mapping.
                                    </p>
                                    <div className="flex gap-4">
                                        <span className="text-[10px] font-bold text-stone-400 uppercase tracking-tighter">EdTech</span>
                                        <span className="text-[10px] font-bold text-stone-400 uppercase tracking-tighter">AI-Integration</span>
                                    </div>
                                </div>

                                {/* ExamCortex - Link to local file */}
                                <a href="Examcortex.html" className="group p-12 bg-[#1B4332] text-white rounded-[3rem] hover:shadow-2xl transition-all duration-500 block relative overflow-hidden">
                                    <div className="relative z-10">
                                        <div className="flex justify-between items-start mb-8">
                                            <div className="bg-white/10 backdrop-blur-md p-3 rounded-2xl">
                                                <ExternalLink />
                                            </div>
                                            <span className="text-[10px] font-bold text-[#e1f0d7] border border-[#e1f0d7]/30 px-4 py-1 rounded-full uppercase tracking-widest">Live Prototype</span>
                                        </div>
                                        <h4 className="text-3xl font-bold mb-4 font-serif">ExamCortex Architecture</h4>
                                        <p className="text-white/70 mb-8 leading-relaxed">
                                            The foundational logic-mesh for competitive exam preparation. View the interface design and cognitive load balancing protocols.
                                        </p>
                                        <div className="flex items-center gap-2 text-[10px] font-bold uppercase tracking-[0.2em] group-hover:gap-4 transition-all">
                                            Explore Framework <ArrowUpRight />
                                        </div>
                                    </div>
                                    {/* Decorative element */}
                                    <div className="absolute -bottom-10 -right-10 w-40 h-40 bg-white/5 rounded-full blur-3xl group-hover:bg-white/10 transition-all"></div>
                                </a>
                            </div>
                        </div>
                    </section>

                    {/* Contact */}
                    <section id="contact" className="py-32 bg-[#dcf2ed] px-6 md:px-12 border-t border-[#D1E7E0]">
                        <div className="max-w-4xl mx-auto text-center">
                            <h2 className="text-6xl md:text-8xl font-medium tracking-tighter mb-12 italic text-[#1B4332] font-serif">Let's Connect.</h2>
                            <form className="text-left grid md:grid-cols-2 gap-10" onSubmit={(e) => e.preventDefault()}>
                                <div className="space-y-3">
                                    <label className="text-[10px] font-bold text-[#2D6A4F] uppercase tracking-[0.2em]">Full Name</label>
                                    <input type="text" placeholder="REQUIRED" className="w-full bg-transparent border-b border-[#2D6A4F]/30 py-4 outline-none focus:border-[#2D6A4F] transition font-medium" />
                                </div>
                                <div className="space-y-3">
                                    <label className="text-[10px] font-bold text-[#2D6A4F] uppercase tracking-[0.2em]">Professional Email</label>
                                    <input type="email" placeholder="EMAIL@EXAMPLE.COM" className="w-full bg-transparent border-b border-[#2D6A4F]/30 py-4 outline-none focus:border-[#2D6A4F] transition font-medium" />
                                </div>
                                <button className="md:col-span-2 w-full bg-[#1B4332] text-white font-bold py-6 rounded-full text-[10px] uppercase tracking-[0.4em] hover:bg-[#2D6A4F] transition shadow-lg">
                                    Initialize Request
                                </button>
                            </form>
                        </div>
                    </section>

                    {/* Footer */}
                    <footer className="py-16 border-t border-[#D1E7E0] px-6 md:px-12 text-center bg-white">
                        <div className="max-w-7xl mx-auto flex flex-col items-center">
                            <span className="text-sm font-bold tracking-[0.2em] uppercase text-[#1B4332]">{profile.name}</span>
                            <div className="h-px w-12 bg-[#D1E7E0] my-6"></div>
                            <p className="text-[9px] font-bold text-stone-300 uppercase tracking-[0.2em]">
                                &copy; 2026 • Actionable Psychology • MA. Counselling Psychology
                            </p>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
